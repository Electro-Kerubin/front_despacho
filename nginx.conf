worker_processes auto;

# Archivo PID accesible por usuario no-root
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    server {
        # Puerto no privilegiado para usuario no-root
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Soporte para React Router (SPA)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy hacia el backend de despachos
        location /api/ {
            proxy_pass        ${VITE_API_URL}/;
            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # Compresión gzip para archivos estáticos
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    }
}
